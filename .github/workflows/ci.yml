name: CI Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # -----------------------------------------------------------------------
      # Android SDK — installs cmdline-tools + required packages.
      # -----------------------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # -----------------------------------------------------------------------
      # Gradle setup — caches distributions, dependencies, and build cache.
      # Build cache reuse across CI runs (gradle/actions/setup-gradle manages
      # this natively, avoiding manual actions/cache fragility).
      # -----------------------------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # -----------------------------------------------------------------------
      # Source hash — used to skip build+tests entirely when code hasn't
      # changed. Covers source files, resources, build scripts, and deps.
      # -----------------------------------------------------------------------
      - name: Compute source hash
        id: source-hash
        run: |
          HASH=$(find app/src app/build.gradle build.gradle settings.gradle \
            gradle.properties dependencies.gradle proguard-rules.pro gradle \
            -type f 2>/dev/null | xargs md5sum 2>/dev/null | sort | \
            md5sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # APK cache — restored by source hash. If hit, Gradle steps are skipped.
      # -----------------------------------------------------------------------
      - name: Cache APK
        id: cache-apk
        uses: actions/cache@v4
        with:
          path: app/build/outputs/apk/debug/app-debug.apk
          key: apk-${{ runner.os }}-${{ steps.source-hash.outputs.hash }}

      - name: Inject secrets into gradle.properties
        if: steps.cache-apk.outputs.cache-hit != 'true'
        env:
          SHIKIMORI_CLIENT_ID: ${{ secrets.SHIKIMORI_CLIENT_ID }}
          SHIKIMORI_CLIENT_SECRET: ${{ secrets.SHIKIMORI_CLIENT_SECRET }}
          SHIKIMORI_BASE_URL: ${{ secrets.SHIKIMORI_BASE_URL }}
          VIDEO_BASE_URL: ${{ secrets.VIDEO_BASE_URL }}
          VK_RANDOM_TOKEN: ${{ secrets.VK_RANDOM_TOKEN }}
        run: |
          [ -n "$SHIKIMORI_CLIENT_ID" ] && echo "ShikimoriClientId=\"$SHIKIMORI_CLIENT_ID\"" >> gradle.properties
          [ -n "$SHIKIMORI_CLIENT_SECRET" ] && echo "ShikimoriClientSecret=\"$SHIKIMORI_CLIENT_SECRET\"" >> gradle.properties
          [ -n "$SHIKIMORI_BASE_URL" ] && echo "ShikimoriBaseUrl=\"$SHIKIMORI_BASE_URL\"" >> gradle.properties
          [ -n "$VIDEO_BASE_URL" ] && echo "VideoBaseUrl=\"$VIDEO_BASE_URL\"" >> gradle.properties
          [ -n "$VK_RANDOM_TOKEN" ] && echo "VkRandomToken=\"$VK_RANDOM_TOKEN\"" >> gradle.properties

      - name: Build with Gradle
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: ./gradlew assembleDebug --no-daemon --build-cache

      - name: Run unit tests
        if: steps.cache-apk.outputs.cache-hit != 'true'
        run: ./gradlew testDebugUnitTest --no-daemon --build-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
