name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release APK
    if: github.event_name == 'workflow_dispatch' || (github.ref_type == 'tag' && !contains(github.ref_name, '-'))
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@b4880220a91f5ee11bb0b6a1cf0a59ff607ebc08 # v3.3.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a50832b66a648b41af8d2a0e10ffd # v4.3.1

      - name: Inject secrets into gradle.properties
        env:
          SHIKIMORI_CLIENT_ID: ${{ secrets.SHIKIMORI_CLIENT_ID }}
          SHIKIMORI_CLIENT_SECRET: ${{ secrets.SHIKIMORI_CLIENT_SECRET }}
          SHIKIMORI_BASE_URL: ${{ secrets.SHIKIMORI_BASE_URL }}
          VIDEO_BASE_URL: ${{ secrets.VIDEO_BASE_URL }}
          VK_RANDOM_TOKEN: ${{ secrets.VK_RANDOM_TOKEN }}
        run: |
          [ -n "$SHIKIMORI_CLIENT_ID" ] && echo "ShikimoriClientId=\"$SHIKIMORI_CLIENT_ID\"" >> gradle.properties
          [ -n "$SHIKIMORI_CLIENT_SECRET" ] && echo "ShikimoriClientSecret=\"$SHIKIMORI_CLIENT_SECRET\"" >> gradle.properties
          [ -n "$SHIKIMORI_BASE_URL" ] && echo "ShikimoriBaseUrl=\"$SHIKIMORI_BASE_URL\"" >> gradle.properties
          [ -n "$VIDEO_BASE_URL" ] && echo "VideoBaseUrl=\"$VIDEO_BASE_URL\"" >> gradle.properties
          [ -n "$VK_RANDOM_TOKEN" ] && echo "VkRandomToken=\"$VK_RANDOM_TOKEN\"" >> gradle.properties

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --build-cache

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          if [ -z "$KEY_ALIAS" ]; then
            echo "::error::KEY_ALIAS secret is not set"
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD secret is not set"
            exit 1
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD secret is not set"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > keystore.orig
          if [ ! -s keystore.orig ]; then
            echo "::error::Decoded keystore is empty. Check KEYSTORE_BASE64."
            exit 1
          fi

          # Re-encode PKCS12 to strip non-standard DER tags (tag number > 30)
          # Some PKCS12 files use newer attribute tags that the JDK's DerValue
          # parser cannot decode. PEM has no tags; re-export creates standard ones.
          openssl pkcs12 -in keystore.orig \
            -password env:KEYSTORE_PASSWORD \
            -nodes 2>/dev/null | \
          openssl pkcs12 -export \
            -out keystore.jks \
            -passout env:KEYSTORE_PASSWORD \
            -name "$KEY_ALIAS" 2>/dev/null
          if [ ! -s keystore.jks ]; then
            echo "::error::OpenSSL PKCS12 re-encoding failed"
            exit 1
          fi

          APK_UNSIGNED=$(find app/build/outputs/apk/release -name "*-unsigned.apk" -type f | head -n 1)
          if [ -z "$APK_UNSIGNED" ]; then
            echo "::error::unsigned APK not found"
            exit 1
          fi

          ANDROID_HOME="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | head -n 1)
          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "::error::Android SDK build-tools not found"
            exit 1
          fi
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"

          APK_SIGNED="${APK_UNSIGNED%-unsigned.apk}.apk"
          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD \
            --out "$APK_SIGNED" \
            "$APK_UNSIGNED"

          echo "signed_apk_path=$APK_SIGNED" >> "$GITHUB_ENV"

      - name: Verify Signed APK
        run: |
          ANDROID_HOME="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* 2>/dev/null | head -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "${{ env.signed_apk_path }}"

      - name: Upload Signed APK
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd6aab436354f7a5933 # v4.6.0
        with:
          name: app-release-signed
          path: ${{ env.signed_apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe605939608e9df0c899fcbd7c35ff8d9ff72 # v2.2.1
        with:
          files: ${{ env.signed_apk_path }}
          generate_release_notes: true
          make_latest: true
