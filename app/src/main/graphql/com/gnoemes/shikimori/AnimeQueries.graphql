query AnimeList($page: PositiveInt, $limit: PositiveInt, $order: OrderEnum, $kind: AnimeKindString, $status: AnimeStatusString, $season: SeasonString, $score: Int, $duration: DurationString, $rating: RatingString, $origin: OriginString, $genre: String, $studio: String, $franchise: String, $censored: Boolean, $mylist: MylistString, $ids: String, $excludeIds: String, $search: String) {
  animes(page: $page, limit: $limit, order: $order, kind: $kind, status: $status, season: $season, score: $score, duration: $duration, rating: $rating, origin: $origin, genre: $genre, studio: $studio, franchise: $franchise, censored: $censored, mylist: $mylist, ids: $ids, excludeIds: $excludeIds, search: $search) {
    id
    name
    russian
    english
    url
    score
    status
    kind
    episodes
    episodesAired
    duration
    season
    rating
    poster {
      mainUrl
      main2xUrl
      previewUrl
      preview2xUrl
    }
    airedOn {
      year
      month
      day
      date
    }
    releasedOn {
      year
      month
      day
      date
    }
  }
}

query AnimeById($ids: String!) {
  animes(ids: $ids, limit: 1) {
    id
    name
    russian
    english
    japanese
    url
    score
    status
    kind
    episodes
    episodesAired
    duration
    rating
    franchise
    description
    descriptionHtml
    nextEpisodeAt
    poster {
      originalUrl
      mainUrl
      main2xUrl
      previewUrl
    }
    airedOn { year month day date }
    releasedOn { year month day date }
    genres {
      name
    }
    studios {
      id
      name
      imageUrl
    }
    videos {
      id
      imageUrl
      playerUrl
      name
      kind
    }
    scoresStats {
      score
      count
    }
    statusesStats {
      status
      count
    }
    userRate {
      id
      score
      status
      episodes
      chapters
      volumes
      rewatches
      text
      createdAt
      updatedAt
    }
    topic {
      id
    }
    externalLinks {
      id
      url
      kind
    }
    screenshots {
      originalUrl
      x166Url
    }
  }
}

query AnimeStaff($ids: String!) {
  animes(ids: $ids, limit: 1) {
    id
    characterRoles {
      character {
        id
        name
        russian
        japanese
        url
        poster {
          originalUrl
          mainUrl
          main2xUrl
          previewUrl
        }
      }
    }
    personRoles {
      rolesEn
      rolesRu
      person {
        id
        name
        russian
        japanese
        url
        poster {
          originalUrl
          mainUrl
          main2xUrl
          previewUrl
        }
      }
    }
  }
}
