apply from: '../dependencies.gradle'
apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'kotlin-parcelize'

// AGP 9.x locks implementation canBeResolved=false, preventing kapt from
// resolving implementation deps on the annotation processor classpath.
configurations {
    implementation {
        canBeResolved = true
    }
    kapt {
        extendsFrom implementation
    }
}

android {
    namespace 'com.gnoemes.shikimori'
    compileSdk versions.compileSdk

    defaultConfig {
        applicationId "com.gnoemes.shikimori"
        minSdk versions.minSdk
        targetSdk versions.targetSdk
        versionCode 1
        versionName "0.8.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            versionNameSuffix "-SNAPSHOT"
        }
    }

    buildTypes.configureEach {
        buildConfigField 'String', 'ShikimoriClientId', ShikimoriClientId
        buildConfigField 'String', 'ShikimoriClientSecret', ShikimoriClientSecret
        buildConfigField 'String', 'ShikimoriBaseUrl', ShikimoriBaseUrl
        buildConfigField 'String', 'VideoBaseUrl', VideoBaseUrl
        buildConfigField 'String', 'VkRandomToken', VkRandomToken
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += 'META-INF/atomicfu.kotlin_module'
        }
    }
}

kapt {
    correctErrorTypes = true
    arguments {
        arg("defaultMoxyStrategy", "moxy.viewstate.strategy.AddToEndSingleStrategy")
        arg("disableEmptyStrategyCheck", "true")
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:" + versions.kotlin

    implementation 'androidx.appcompat:appcompat:' + versions.androidx
    implementation 'androidx.preference:preference:' + versions.androidxPrefs
    implementation 'androidx.constraintlayout:constraintlayout:' + versions.constraint
    implementation 'androidx.fragment:fragment-ktx:' + versions.androidxFragment
    implementation 'androidx.core:core-ktx:' + versions.ktx
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.material:material:' + versions.material
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'androidx.media:media:1.7.0'

    implementation "androidx.room:room-runtime:" + versions.room
    implementation "androidx.room:room-rxjava2:" + versions.room
    kapt "androidx.room:room-compiler:" + versions.room

    implementation "com.google.dagger:dagger-android:" + versions.dagger
    implementation "com.google.dagger:dagger-android-support:" + versions.dagger
    kapt "com.google.dagger:dagger-android-processor:" + versions.dagger
    kapt "com.google.dagger:dagger-compiler:" + versions.dagger
    kapt "com.google.dagger:dagger-android-support:" + versions.dagger
    kapt "com.google.dagger:dagger-android:" + versions.dagger

    implementation 'io.reactivex.rxjava2:rxandroid:' + versions.rxAndroid
    implementation "io.reactivex.rxjava2:rxjava:" + versions.rxJava

    implementation "com.squareup.retrofit2:retrofit:" + versions.retrofit
    implementation "com.squareup.retrofit2:converter-gson:" + versions.retrofit
    implementation "com.squareup.retrofit2:adapter-rxjava2:" + versions.retrofit
    implementation "com.squareup.okhttp3:okhttp:" + versions.okHttp
    implementation "com.squareup.okhttp3:logging-interceptor:" + versions.okHttp
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:' + versions.urlConnection

    implementation "com.github.moxy-community:moxy:" + versions.moxy
    implementation "com.github.moxy-community:moxy-androidx:" + versions.moxy
    kapt "com.github.moxy-community:moxy-compiler:" + versions.moxy
    kapt "com.github.moxy-community:moxy:" + versions.moxy

    implementation "com.github.bumptech.glide:glide:" + versions.glide
    implementation "com.github.bumptech.glide:okhttp3-integration:" + versions.glide
    kapt "com.github.bumptech.glide:compiler:" + versions.glide

    implementation "com.google.code.gson:gson:" + versions.gson
    implementation 'net.danlew:android.joda:2.12.7'
    implementation 'com.afollestad.material-dialogs:core:3.3.0'
    implementation 'com.afollestad.material-dialogs:input:3.3.0'
    implementation 'com.afollestad.material-dialogs:files:3.3.0'
    implementation 'com.afollestad.material-dialogs:datetime:3.3.0'
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    implementation 'com.hannesdorfmann:adapterdelegates4:4.3.2'
    implementation 'com.facebook.shimmer:shimmer:0.5.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'

    implementation 'com.google.android.flexbox:flexbox:3.0.0'
    
    implementation "com.google.android.exoplayer:exoplayer:" + versions.exoplayer
    implementation "com.google.android.exoplayer:extension-mediasession:" + versions.exoplayer

    implementation 'com.github.terrakok:cicerone:5.1.1'

    implementation 'org.kefirsf:kefirbb:1.5'

    implementation platform('com.google.firebase:firebase-bom:' + versions.firebase)
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-crashlytics'

    implementation 'com.github.ome450901:SimpleRatingBar:1.5.1'
    implementation 'org.jsoup:jsoup:1.17.2'

    implementation 'androidx.multidex:multidex:2.0.1'
    
    implementation files("../libs/drawer-behavior-0.0.5.aar")
    implementation files("../libs/kotlin-permissions-1.0.3.aar")
}

apply plugin: 'com.google.gms.google-services'
